<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>
  <body>
    <main>
      <div class="calculator">
        <input type="text" id="display" readonly />
        <div class="buttons">
          <button class="red-btn">AC</button>
          <button class="blue-btn">Del</button>
          <button class="blue-btn">/</button>
          <button class="blue-btn">*</button>
          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button class="blue-btn">-</button>
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button class="blue-btn">+</button>
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button class="equal blue-btn">=</button>
          <button class="zero">0</button>
          <button class="zero">00</button>
          <button>.</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
